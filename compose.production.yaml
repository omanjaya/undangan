name: undanganonline-production

# Standalone file: docker compose -f compose.production.yaml up --build -d
services:
  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: development
    init: true
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://undangan:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/undangan
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: production
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-4321}:4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      UPLOAD_DIR: /app/.data/uploads
      UPLOAD_STORAGE_MB: ${UPLOAD_STORAGE_MB:-1024}
      DATABASE_URL: postgresql://undangan:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/undangan
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD}
      APP_URL: ${APP_URL:?Set APP_URL to your public HTTPS origin}
    volumes:
      - app_data:/app/.data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: undangan
      POSTGRES_USER: undangan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undangan -d undangan"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  app_data:
